<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>BTM AI</title><style>body{margin:0;background:#0b1020;color:#f3f4f6;font:16px system-ui}main{max-width:700px;margin:auto;padding:22px}h1{margin-bottom:0}.muted{color:#a5b4c8}section{background:#192235;border-radius:16px;padding:18px;margin:18px 0}input,select,button{padding:12px;border-radius:9px;border:1px solid #44516a;background:#10192c;color:white;margin:4px 0;box-sizing:border-box}input{width:100%}button{background:#3b82f6;border:0;cursor:pointer;font-weight:700}li{margin:10px 0;overflow-wrap:anywhere}.del{background:#7f1d1d;float:right}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{background:#26354d}.hide{display:none}</style></head><body><main><h1>🤖 BTM AI</h1><p class="muted">Kişisel ajans yönetim panelin • İlk sürüm</p><nav><button onclick="tab('clients')">Müşteriler</button><button onclick="tab('shoots')">Çekimler</button><button onclick="tab('tasks')">Görevler</button></nav><section id="clients"><h2>👥 Müşteriler</h2><form onsubmit="add(event,'clients')"><input name="title" placeholder="Müşteri / marka adı" required maxlength="120"><button>Ekle</button></form><ul></ul></section><section id="shoots" class="hide"><h2>📅 Çekim Takvimi</h2><form onsubmit="add(event,'shoots')"><input name="title" placeholder="Çekim / marka adı" required maxlength="120"><input name="date" type="datetime-local" required><button>Çekim ekle</button></form><ul></ul></section><section id="tasks" class="hide"><h2>✅ Görevler</h2><form onsubmit="add(event,'tasks')"><input name="title" placeholder="Yapılacak iş" required maxlength="120"><button>Görev ekle</button></form><ul></ul></section><p class="muted">Veriler yalnızca bu tarayıcıda tutulur. Tarayıcı verilerini silersen kayıtlar kaybolabilir. Henüz hesap, bulut senkronizasyonu veya Instagram bağlantısı yoktur.</p></main><script>const types=['clients','shoots','tasks'];let db={};try{db=JSON.parse(localStorage.getItem('btm-ai-v1')||'{}')}catch{};for(const t of types)if(!Array.isArray(db[t]))db[t]=[];function save(){localStorage.setItem('btm-ai-v1',JSON.stringify(db))}function tab(t){for(const x of types)document.getElementById(x).classList.toggle('hide',x!==t)}function add(e,t){e.preventDefault();let f=e.target;db[t].push({id:crypto.randomUUID(),title:f.elements.title.value.trim(),date:f.elements.date?.value||'',done:false});save();f.reset();render()}function remove(t,id){db[t]=db[t].filter(x=>x.id!==id);save();render()}function toggle(id){let x=db.tasks.find(x=>x.id===id);if(x){x.done=!x.done;save();render()}}function render(){for(const t of types){let ul=document.querySelector('#'+t+' ul');ul.replaceChildren();for(const x of db[t]){let li=document.createElement('li');let span=document.createElement('span');span.textContent=x.title+(x.date?' — '+new Date(x.date).toLocaleString('tr-TR'):'');if(x.done)span.style.textDecoration='line-through';li.append(span);if(t==='tasks'){let b=document.createElement('button');b.textContent=x.done?'Geri al':'Tamamla';b.onclick=()=>toggle(x.id);li.append(' ',b)}let del=document.createElement('button');del.className='del';del.textContent='Sil';del.onclick=()=>remove(t,x.id);li.append(del);ul.append(li)}}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
